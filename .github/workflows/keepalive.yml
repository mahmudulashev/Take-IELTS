name: Supabase keepalive

# Bepul tarifdagi Supabase loyihasi bir necha kun so'rovsiz tursa avtomatik
# to'xtaydi. O'shanda sayt "natija yo'q" holatiga tushadi va foydalanuvchiga
# ma'lumotlari o'chgandek ko'rinadi. Shu ish kuniga bir marta bazaga haqiqiy
# so'rov yuborib, loyihani uyg'oq tutadi.
#
# DIQQAT: GitHub jadval bo'yicha ishlarni repo 60 kun tinch tursa o'chiradi.
# Repoda muntazam commit bo'lsa muammo yo'q.

on:
  schedule:
    - cron: '17 3 * * *'   # har kuni 03:17 UTC
  workflow_dispatch:        # qo'lda ham ishga tushirish mumkin

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Bazaga so'rov yuborish
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "SUPABASE_URL yoki SUPABASE_ANON_KEY secret'i o'rnatilmagan."
            exit 1
          fi

          # Haqiqiy jadval so'rovi kerak: shunda so'rov bazagacha yetib boradi.
          # RLS tufayli anon kalit bo'sh ro'yxat oladi — bu kutilgan natija.
          code=$(curl -sS -o /tmp/response.txt -w '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/writing_results?select=id&limit=1")

          echo "HTTP $code"
          head -c 200 /tmp/response.txt || true
          echo

          case "$code" in
            2*) echo "Baza javob berdi — loyiha uyg'oq." ;;
            *)  echo "Baza javob bermadi. Loyiha to'xtagan bo'lishi mumkin."; exit 1 ;;
          esac
